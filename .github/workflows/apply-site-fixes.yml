name: Apply Jyotish Vimarsha fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production bugs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          idx = Path('index.html')
          s = idx.read_text(encoding='utf-8')

          old = '''function cleanAstroText(text) {\n  if (!text)\n    return "";\n  return String(text).replace(/\\r/g, "").replace(/[ \\t]+\\n/g, "\\n").replace(/```[a-z]*\\n[\\s\\S]*?```/g, "").replace(/^[ \\t]*[\\*\\-_#]{3,}[ \\t]*$/gm, "").replace(/^#{1,6}\\s*(.*?)\\s*#{1,6}$/gm, "### $1").replace(/^([ \\t]*[•\\-\\*+]\\s*)\\*+([^*\\n]+)\\*+/gm, "$1**$2**").replace(/[\\+\\|](?:---+[\\+\\|])+/g, "").replace(/\\bundefined\\b/g, "").replace(/\\bnull\\b/g, "").trim();\n}'''
          new = '''function cleanAstroText(text) {\n  if (!text) return "";\n  let s = String(text)\n    .replace(/\\r/g, "")\n    .replace(/```[a-z]*\\n[\\s\\S]*?```/gi, "")\n    .replace(/\\bundefined\\b/gi, "")\n    .replace(/\\bnull\\b/gi, "");\n  s = s.split("\\n").map(line => {\n    let x = String(line).trim();\n    if (!x) return "";\n    if (/^[#*\\-_+=~`\\s]{1,20}$/.test(x)) return "";\n    x = x.replace(/^(?:[#*]+)\\s*(?:[#*]+)\\s*/g, "");\n    x = x.replace(/\\s*(?:[#*]+)\\s*$/g, "");\n    const hm = x.match(/^#{1,6}\\s*(.+)$/);\n    if (hm) return "### " + hm[1].replace(/^[#*]+\\s*/, "").trim();\n    x = x.replace(/#\\*\\*?/g, "**").replace(/\\*\\*?#/g, "**");\n    return x;\n  }).join("\\n");\n  return s\n    .replace(/[ \\t]+\\n/g, "\\n")\n    .replace(/^[ \\t]*[\\*\\-_#]{3,}[ \\t]*$/gm, "")\n    .replace(/[\\+\\|](?:---+[\\+\\|])+/g, "")\n    .replace(/\\n{3,}/g, "\\n\\n")\n    .trim();\n}'''
          if old not in s: raise SystemExit('cleanAstroText block not found')
          s = s.replace(old, new, 1)

          s = s.replace('if (vipAccess && plan !== "dakshina")', 'if ((vipAccess || window.vipAccess || document.body.classList.contains("vip-active")) && plan !== "dakshina")', 1)

          old_vip = '''localStorage.setItem("jyotish_vip_unlocked", "1");'''
          new_vip = '''localStorage.setItem("jyotish_vip_unlocked", "1");\n      if (window.lastVipCode) localStorage.setItem("jyotish_vip_code", window.lastVipCode);'''
          if old_vip not in s: raise SystemExit('VIP persistence marker not found')
          s = s.replace(old_vip, new_vip, 1)

          old_load = '''if (localStorage.getItem("jyotish_vip_unlocked") === "1") {\n      if (typeof window.enableVipAccess === "function")\n        window.enableVipAccess();\n    }'''
          new_load = '''if (localStorage.getItem("jyotish_vip_unlocked") === "1") {\n      window.lastVipCode = localStorage.getItem("jyotish_vip_code") || "";\n      if (typeof window.enableVipAccess === "function")\n        window.enableVipAccess();\n    }'''
          if old_load not in s: raise SystemExit('VIP restore block not found')
          s = s.replace(old_load, new_load, 1)

          marker = '''  if (chatQuestionsUsed >= MAX_CHAT_QUESTIONS) {\n    alert("You have used all 5 questions for this reading. End the reading to start a new consultation.");\n    return;\n  }\n  \n  chatQuestionsUsed++;'''
          replacement = '''  if (chatQuestionsUsed >= MAX_CHAT_QUESTIONS) {\n    alert("You have used all 5 questions for this reading. End the reading to start a new consultation.");\n    return;\n  }\n\n  const isVipQuestion = Boolean(window.vipAccess || document.body.classList.contains("vip-active"));\n  if (!isVipQuestion && !(window.SERVER_CONFIG?.features?.chat === false)) {\n    const questionPaid = yield window.requestPaidAccess("question");\n    if (!questionPaid) return;\n  }\n\n  chatQuestionsUsed++;'''
          if marker not in s: raise SystemExit('chat send marker not found')
          s = s.replace(marker, replacement, 1)
          s = s.replace('if (window.consumeQuestionCredit) window.consumeQuestionCredit();', 'if (!isVipQuestion && window.consumeQuestionCredit) window.consumeQuestionCredit();', 2)
          idx.write_text(s, encoding='utf-8')

          g = Path('api/_lib/gemini.js')
          gs = g.read_text(encoding='utf-8')
          old_validate = '''async function validatePremiumSession(sessionToken, vipToken) {\n  if (vipToken) {\n    const vips = loadJsonFile('vip_codes.json', []);\n    const h = crypto.createHash('sha256').update(String(vipToken).trim().toUpperCase()).digest('hex');\n    const v = vips.find(x => (x.display_code === vipToken || x.code_hash === h) && x.active);\n    if (v) return true;\n  }\n  if (sessionToken) {\n    const pays = loadJsonFile('payments.json', []);\n    const p = pays.find(x => x.session_token === sessionToken);\n    if (p) return true;\n    if (sessionToken.startsWith('test_') || sessionToken.startsWith('sess_') || sessionToken.length > 5) {\n      return true;\n    }\n  }\n  return true;\n}'''
          new_validate = '''async function validatePremiumSession(sessionToken, vipToken) {\n  if (vipToken) {\n    const normalized = String(vipToken).trim().toUpperCase();\n    const h = crypto.createHash('sha256').update(normalized).digest('hex');\n    const vips = loadJsonFile('vip_codes.json', []);\n    const v = vips.find(x => (x.display_code === vipToken || x.display_code === normalized || x.code_hash === h) && x.active !== false);\n    if (v) return true;\n  }\n  if (sessionToken) {\n    const pays = loadJsonFile('payments.json', []);\n    const p = pays.find(x => x.session_token === sessionToken);\n    if (p && ['paid', 'captured', 'verified'].includes(String(p.status).toLowerCase())) return true;\n  }\n  return false;\n}'''
          if old_validate not in gs: raise SystemExit('gemini validate block not found')
          gs = gs.replace(old_validate, new_validate, 1)
          gs = gs.replace('temperature: 0.7,', 'temperature: 0.7,\n          maxOutputTokens: Math.max(256, Number(maxTokens) || 8192),', 1)
          gs = gs.replace("setTimeout(() => reject(new Error('AI generation timed out after 14 seconds')), 14000)", "setTimeout(() => reject(new Error('AI generation timed out after 45 seconds')), 45000)", 1)
          g.write_text(gs, encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html api/_lib/gemini.js
          if git diff --cached --quiet; then echo "No changes needed."; else git commit -m "fix: clean reports and repair Ask the Chart" && git push; fi
