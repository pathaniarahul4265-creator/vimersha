name: Fix settings schema mapping
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply settings schema fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/[...path].js')
          s=p.read_text(encoding='utf-8')
          old="""          for(const k of ['reveal_enabled','match_enabled','question_enabled','offer_enabled']) if(k in b) patch[k]= (b[k]==='1' || b[k]===true);\n          patch.updated_at=new Date().toISOString();\n          await db.update('settings',patch,'id=eq.1');"""
          new="""          for(const k of ['reveal_enabled','match_enabled','question_enabled','offer_enabled']) if(k in b) {\n            const dbKey = k === 'question_enabled' ? 'chat_enabled' : k;\n            patch[dbKey] = (b[k] === '1' || b[k] === true);\n          }\n          patch.updated_at=new Date().toISOString();\n          const saved = await db.update('settings',patch,'id=eq.1');\n          if (saved === false) return json(res,500,{ok:false,error:'Could not persist settings to the database.'});"""
          if old not in s:
            raise SystemExit('settings mapping block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'api/[...path].js'
          git commit -m "fix: persist question setting as chat_enabled" || true
          git push
          git rm .github/workflows/fix-settings-schema.yml
          git commit -m "chore: remove one-time settings fixer"
          git push
