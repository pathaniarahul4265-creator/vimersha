name: Apply frontend pricing sync
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync frontend checkout amount with saved pricing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          old = "const payload = { plan };\n      if (customAmount) payload.amount = Math.round(customAmount * 100);"
          new = "const payload = { plan };\n      const livePrices = window.SERVER_CONFIG?.prices || {};\n      const amountINR = customAmount || livePrices[plan] || p.amountINR;\n      if (amountINR) payload.amount = Math.round(Number(amountINR) * 100);"
          if old not in s:
              raise SystemExit('pricing checkout block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git rm .github/workflows/apply-pricing-sync.yml
          git commit -m "fix: honor admin pricing in frontend checkout"
          git push
